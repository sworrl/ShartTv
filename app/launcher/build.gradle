plugins { id 'com.android.application' }
android {
  namespace 'com.sharttv.launcher'
  compileSdk 34
  def windyFile = rootProject.file("windy.properties")
  def windy = new Properties()
  if (windyFile.exists()) windy.load(new FileInputStream(windyFile))
  def wkey = { k -> "\"" + (windy[k] ?: "") + "\"" }
  buildFeatures { buildConfig true }
  defaultConfig {
    applicationId "com.sharttv.launcher"
    minSdk 29
    targetSdk 34
    versionCode 1
    versionName "0.1"
    buildConfigField "String", "WINDY_POINT_KEY", wkey("WINDY_POINT_KEY")
    buildConfigField "String", "WINDY_WEBCAMS_KEY", wkey("WINDY_WEBCAMS_KEY")
    buildConfigField "String", "WINDY_MAP_KEY", wkey("WINDY_MAP_KEY")
  }
  def ksPropsFile = rootProject.file("keystore.properties")
  def ksProps = new Properties()
  if (ksPropsFile.exists()) ksProps.load(new FileInputStream(ksPropsFile))
  signingConfigs {
    release {
      if (ksPropsFile.exists()) {
        storeFile rootProject.file(ksProps['storeFile'])
        storePassword ksProps['storePassword']
        keyAlias ksProps['keyAlias']
        keyPassword ksProps['keyPassword']
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
      debuggable false
    }
    debug { }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'androidx.cardview:cardview:1.0.0'
  implementation 'androidx.core:core:1.13.1'
}

configurations.all {
  resolutionStrategy {
    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
  }
}
